<style>
:root{color-scheme:dark;--bg:#0D0A0E;--ink:#F7EEF3;--grey:#B9A8B3;--line:#3B2633;--pink:#FF5C9A;--pinkd:#B8326A;--good:#13301F;--bad:#3A1222;--card:#19121A;--field:#120D13}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:rgba(13,10,14,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-weight:800;font-size:17px;white-space:nowrap}
.meter{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px}
.meter span{font-size:13px;font-weight:700}
.segs{display:flex;gap:5px}
.seg{width:22px;height:16px;border-radius:6px;background:#2E2029;transition:background .5s,transform .3s}
.seg.on{transform:scale(1.12)}
.bar{height:5px;background:#2A1C25}.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
main{max-width:760px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px;margin-bottom:18px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(34px,7vw,52px);line-height:1.05;margin:0 0 10px;font-weight:800}
h2{font-size:clamp(24px,5vw,32px);margin:0 0 6px;font-weight:800}
p{line-height:1.55;margin:0 0 12px;font-size:17px}
.muted{color:var(--grey)}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;color:#16080F;font-weight:700;font-size:14px;margin-bottom:10px}
button{font-family:inherit;cursor:pointer;border:none}
.btn{background:var(--pink);color:#16080F;font-weight:700;font-size:17px;padding:14px 26px;border-radius:999px;min-height:48px}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.pink{background:var(--pink);color:#16080F}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;color:var(--grey);font-size:15px}
.prompt{font-size:clamp(32px,7.5vw,52px);font-weight:800;line-height:1.15;margin:8px 0 6px}
.prompt .pr{color:var(--pink)}
.prompt .plus{color:#8E7D88;font-weight:600}
.hint{font-size:17px;color:var(--grey);margin-bottom:16px}
.answerzone{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:8px}
.mic{width:76px;height:76px;border-radius:50%;background:var(--pink);color:#16080F;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 0 var(--pinkd);transition:transform .1s}
.mic:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pinkd)}
.mic.rec{animation:pulse 1s infinite;background:#FF2E7E}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,154,.55)}100%{box-shadow:0 0 0 22px rgba(255,92,154,0)}}
.mic svg{width:34px;height:34px}
.typebox{flex:1;min-width:200px;display:flex;gap:8px}
.typebox input{flex:1;min-width:0;font-family:inherit;font-size:20px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--field);color:var(--ink)}
.typebox input:focus{outline:3px solid rgba(255,92,154,.45);border-color:var(--pink)}
.status{min-height:26px;margin-top:10px;font-size:15px;color:var(--grey)}
.fb{margin-top:14px;border-radius:18px;padding:16px 18px;animation:in .3s ease}
.fb.ok{background:var(--good);border:2px solid #3FA872}
.fb.no{background:var(--bad);border:2px solid #C2416F}
.fb .big{font-size:22px;font-weight:800;margin-bottom:4px}
.fb .ans{font-size:28px;font-weight:800;margin:4px 0}
.why{background:#24151F;border:2px solid #5A2D47;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:16px;line-height:1.5}
.why b{color:var(--ink)}
.end{font-weight:800}
.chg{color:var(--pink);font-weight:800}
.listen{background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.listen svg{width:18px;height:18px}
.choices{display:grid;gap:10px;margin-top:10px}
.choice{background:var(--field);border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;font-size:22px;font-weight:700;color:var(--ink);min-height:56px}
.choice:hover{border-color:var(--pink)}
.choice.right{background:var(--good);border-color:#3FA872}
.choice.wrong{background:var(--bad);border-color:#C2416F}
.choice:disabled{cursor:default}
.sticker{text-align:center}
.sticker img{max-width:min(340px,80%);border-radius:20px;border:4px solid var(--pink);box-shadow:0 10px 40px rgba(255,92,154,.25);transform:rotate(-2deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
.table{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:12px 0;font-size:20px}
.table div:nth-child(odd){color:var(--grey)}
.table div:nth-child(even){font-weight:800}
.warn{background:#24151F;border:2px solid #5A2D47;border-radius:14px;padding:10px 14px;font-size:15px;margin-top:12px}
.scorebig{font-size:56px;font-weight:800;color:var(--pink)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-20px;width:12px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.small{font-size:14px}
.progress-list{display:grid;gap:8px;margin:14px 0}
.progress-list div{display:flex;justify-content:space-between;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
.fbwrap{display:flex;gap:16px;align-items:flex-start}.fbmain{flex:1;min-width:0}
.fbst{width:120px;height:120px;object-fit:cover;border-radius:18px;border:3px solid var(--pink);flex:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.fb.ok .fbst{border-color:#3FA872}
.explain{display:inline-flex;align-items:center;gap:10px;background:transparent;border:2px solid var(--pink);color:var(--ink);border-radius:999px;padding:4px 16px 4px 4px;font-weight:700;font-size:15px;min-height:48px}
.explain img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.explain[aria-expanded=true]{background:var(--pink);color:#16080F}
.exbox{margin-top:14px;background:var(--field);border:2px solid var(--line);border-radius:18px;padding:16px 18px;animation:in .3s ease}
.exbox h3{margin:0 0 6px;font-size:22px}.exbox h3 .m{color:var(--pink)}
.exbox p{font-size:16px;margin:0 0 10px}
.extable{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:10px 0 12px;font-size:18px}
.extable div{padding:4px 10px;border-radius:10px}
.extable div:nth-child(odd){color:var(--grey)}
.extable div:nth-child(even){font-weight:800}
.extable .hi{background:rgba(255,92,154,.16)}
.trick{background:#24151F;border:2px dashed #5A2D47;border-radius:14px;padding:10px 14px;font-size:15px;margin-top:8px}
.prompt .sent{font-size:clamp(24px,5.4vw,34px);line-height:1.35;display:block}
.prompt .say2{font-size:clamp(20px,4.4vw,26px);font-weight:600;line-height:1.45;display:block;margin-bottom:6px}
.prompt .say2 i{color:var(--grey);font-style:normal;font-weight:500;font-size:.75em}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--pink);color:var(--pink);text-align:center}
.inf{color:var(--grey);font-weight:600;font-size:.7em}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.words span{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--ink)}
.words span b{color:var(--pink);font-weight:700}
@media (max-width:520px){.fbst{width:88px;height:88px}}
@media (max-width:520px){.meter span{display:none}.brand{font-size:15px}.card{padding:18px}.mic{width:68px;height:68px}}
.resume{background:#24151F;border:2px solid var(--pink);border-radius:16px;padding:14px 16px;margin:14px 0}
.resume p{margin:0 0 10px}
@media (max-width:520px){
main{padding:12px 12px 120px}
.card{padding:14px;border-radius:20px}
.prompt{font-size:clamp(22px,6.2vw,28px);line-height:1.2}
.prompt .sent{font-size:clamp(19px,5vw,24px)}
.prompt .say2{font-size:clamp(16px,4.2vw,19px)}
h1{font-size:30px}h2{font-size:22px}p{font-size:16px}
.hint{font-size:15px;margin-bottom:10px}
.mic{width:58px;height:58px}.mic svg{width:28px;height:28px}
.typebox{min-width:0;flex:1 1 0}
.typebox input{font-size:18px;padding:10px 12px}
.btn{padding:12px 18px;font-size:16px}
.status{font-size:17px;color:var(--ink);font-weight:600}
.choice{font-size:18px;padding:12px 14px;min-height:48px}
.fb .ans{font-size:22px}.fb .big{font-size:19px}
.fbst{width:64px;height:64px}
.topin{padding:8px 12px}
}
</style>
</head>

<script>
const DATA = {"tag": "Practice · Verb conjugations", "brand": "Glhea · Verbs", "intro": "This is the practice for the <b>verb conjugations</b> video: yo hablo, yo voy, yo tengo... plus a new verb you asked about: <b>dar</b>! Each question shows what the verb means, and the <b>Explain</b> cat gives you the full story after you answer.", "sections": [{"title": "Who? (pronouns)", "color": "#FF5C9A", "howto": "Tap the Spanish word.", "lesson": "<div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>I</div><div>tú</div><div>you (friend)</div><div>él / ella / usted</div><div>he / she / you (polite)</div><div>nosotros</div><div>we</div><div>ellos / ustedes</div><div>they / you all</div></div>", "questions": [{"p": "we", "options": ["ellos", "nosotros", "ustedes"], "a": 1, "why": "<b>nosotros</b> = we. (nosotras if it's all girls!)", "ex": "<h3>Pronouns = <span class='m'>who is doing it</span></h3><div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>I</div><div>tú</div><div>you (friend)</div><div>él / ella / usted</div><div>he / she / you (polite)</div><div>nosotros</div><div>we</div><div>ellos / ustedes</div><div>they / you all</div></div><p><b>usted</b> is the polite 'you'. It uses the same verb form as él / ella because it comes from <i>vuestra merced</i> = 'your grace'. In Costa Rica people use usted a lot, even with friends!</p><p><b>ustedes</b> = you all. In Latin America it's used for any group of 'you'.</p><p class='muted'>Girls only? nosotras, ellas.</p>"}, {"p": "you (a friend)", "options": ["tú", "usted", "yo"], "a": 0, "why": "<b>tú</b> = you, for friends and family.", "ex": "<h3>Pronouns = <span class='m'>who is doing it</span></h3><div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>I</div><div>tú</div><div>you (friend)</div><div>él / ella / usted</div><div>he / she / you (polite)</div><div>nosotros</div><div>we</div><div>ellos / ustedes</div><div>they / you all</div></div><p><b>usted</b> is the polite 'you'. It uses the same verb form as él / ella because it comes from <i>vuestra merced</i> = 'your grace'. In Costa Rica people use usted a lot, even with friends!</p><p><b>ustedes</b> = you all. In Latin America it's used for any group of 'you'.</p><p class='muted'>Girls only? nosotras, ellas.</p>"}, {"p": "you (polite)", "options": ["tú", "ella", "usted"], "a": 2, "why": "<b>usted</b> = polite you. It uses the él / ella verb form. In Costa Rica people use it a lot!", "ex": "<h3>Pronouns = <span class='m'>who is doing it</span></h3><div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>I</div><div>tú</div><div>you (friend)</div><div>él / ella / usted</div><div>he / she / you (polite)</div><div>nosotros</div><div>we</div><div>ellos / ustedes</div><div>they / you all</div></div><p><b>usted</b> is the polite 'you'. It uses the same verb form as él / ella because it comes from <i>vuestra merced</i> = 'your grace'. In Costa Rica people use usted a lot, even with friends!</p><p><b>ustedes</b> = you all. In Latin America it's used for any group of 'you'.</p><p class='muted'>Girls only? nosotras, ellas.</p>"}, {"p": "you all", "options": ["ustedes", "nosotros", "ellos"], "a": 0, "why": "<b>ustedes</b> = you all. It uses the ellos verb form.", "ex": "<h3>Pronouns = <span class='m'>who is doing it</span></h3><div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>I</div><div>tú</div><div>you (friend)</div><div>él / ella / usted</div><div>he / she / you (polite)</div><div>nosotros</div><div>we</div><div>ellos / ustedes</div><div>they / you all</div></div><p><b>usted</b> is the polite 'you'. It uses the same verb form as él / ella because it comes from <i>vuestra merced</i> = 'your grace'. In Costa Rica people use usted a lot, even with friends!</p><p><b>ustedes</b> = you all. In Latin America it's used for any group of 'you'.</p><p class='muted'>Girls only? nosotras, ellas.</p>"}, {"p": "they", "options": ["él", "ellos", "usted"], "a": 1, "why": "<b>ellos</b> = they (ellas if it's all girls).", "ex": "<h3>Pronouns = <span class='m'>who is doing it</span></h3><div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>I</div><div>tú</div><div>you (friend)</div><div>él / ella / usted</div><div>he / she / you (polite)</div><div>nosotros</div><div>we</div><div>ellos / ustedes</div><div>they / you all</div></div><p><b>usted</b> is the polite 'you'. It uses the same verb form as él / ella because it comes from <i>vuestra merced</i> = 'your grace'. In Costa Rica people use usted a lot, even with friends!</p><p><b>ustedes</b> = you all. In Latin America it's used for any group of 'you'.</p><p class='muted'>Girls only? nosotras, ellas.</p>"}]}, {"title": "-AR verbs", "color": "#FF9F6B", "howto": "Tap the mic and say the right form (or type it).", "lesson": "<p>stem + <b style=\"color:#FF9F6B\">o · as · a · amos · an</b></p>", "questions": [{"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> hablar", "hint": "hablar = to speak / to talk", "show": "yo habl[o]", "say": "yo hablo", "a": ["hablo"], "why": "Regular -ar: habl + <b>o</b>. The yo form always ends in -o for regular verbs.", "ex": "<h3>hablar = <span class=\"m\">to speak / to talk</span></h3><p>Regular <b>-ar</b> verb: stem <b>habl-</b> + o, as, a, amos, an.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>habl<span style=\"color:#FF9F6B;font-weight:800\">o</span></div><div>tú</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">as</span></div><div>él / ella / usted</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">a</span></div><div>nosotros</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Hablo inglés.</b> = I speak English.</p>"}, {"p": "<span class=\"pr\">tú</span> <span class=\"plus\">+</span> trabajar", "hint": "trabajar = to work", "show": "tú trabaj[as]", "say": "tú trabajas", tudiar = to study", "show": "nosotros estudi[amos]", "say": "nosotros estudiamos", "a": ["estudiamos"], "why": "nosotros → <b>-amos</b>. Nosotros always ends in -mos!", "ex": "<h3>estudiar = <span class=\"m\">to study</span></h3><p>Regular <b>-ar</b> verb: stem <b>estudi-</b> + o, as, a, amos, an. The i stays.</p><div class=\"extable\"><div>yo</div><div>estudi<span style=\"color:#FF9F6B;font-weight:800\">o</span></div><div>tú</div><div>estudi<span style=\"color:#FF9F6B;font-weight:800\">as</span></div><div>él / ella / usted</div><div>estudi<span style=\"color:#FF9F6B;font-weight:800\">a</span></div><div class=hi>nosotros</div><div class=hi>estudi<span style=\"color:#FF9F6B;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>estudi<span style=\"color:#FF9F6B;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Estudio español todos los días.</b> = I study Spanish every day.</p><div class=\"trick\"><b>Memory trick:</b> estudiar looks like <b>study</b>.</div>"}, {"p": "<span class=\"pr\">ellos</span> <span class=\"plus\">+</span> hablar", "hint": "hablar = to speak / to talk", "show": "ellos habl[an]", "say": "ellos hablan", "a": ["hablan"], "why": "ellos / ustedes → <b>-an</b>: habl + an.", "ex": "<h3>hablar = <span class=\"m\">to speak / to talk</span></h3><p>Regular <b>-ar</b> verb: stem <b>habl-</b> + o, as, a, amos, an.</p><div class=\"extable\"><div>yo</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">o</span></div><div>tú</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">as</span></div><div>él / ella / usted</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">a</span></div><div>nosotros</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">amos</span></div><div class=hi>ellos / ustedes</div><div class=hi>habl<span style=\"color:#FF9F6B;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Hablo inglés.</b> = I speak English.</p>"}, {"p": "<span class=\"pr\">usted</span> <span class=\"plus\">+</span> trabajar", "hint": "trabajar = to work", "show": "usted trabaj[a]", "say": "usted trabaja", "a": ["trabaja"], "why": "<b>usted</b> uses the él / ella form: trabaj + <b>a</b>.", "ex": "<h3>trabajar = <span class=\"m\">to work</span></h3><p>Regular <b>-ar</b> verb: stem <b>trabaj-</b> + o, as, a, amos, an.</p><div class=\"extable\"><div>yo</div><div>trabaj<span style=\"color:#FF9F6B;font-weight:800\">o</span></div><div>tú</div><div>trabaj<span style=\"color:#FF9F6B;font-weight:800\">as</span></div><div class=hi>él / ella / usted</div><div class=hi>trabaj<span style=\"color:#FF9F6B;font-weight:800\">a</span></div><div>nosotros</div><div>trabaj<span style=\"color:#FF9F6B;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>trabaj<span style=\"color:#FF9F6B;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Trabajo en una escuela.</b> = I work at a school.</p>"}]}, {"title": "-ER & -IR verbs", "color": "#5ED6BC", "howto": "Same endings, except nosotros: -emos (-er) / -imos (-ir).", "lesson": "<p>stem + <b style=\"color:#5ED6BC\">o · es · e · emos/imos · en</b></p>", "questions": [{"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> comer", "hint": "comer = to eat", "show": "yo com[o]", "say": "yo como", "a": ["como"], "why": "yo → <b>-o</b>, for every regular verb: com + o.", "ex": "<h3>comer = <span class=\"m\">to eat</span></h3><p>Regular <b>-er</b> verb: stem <b>com-</b> + o, es, e, emos, en.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>com<span style=\"color:#5ED6BC;font-weight:800\">o</span></div><div>tú</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">es</span></div><div>él / ella / usted</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">e</span></div><div>nosotros</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Comes carne?</b> = Do you eat meat?</p><div class=\"trick\"><b>Memory trick:</b> <b>comer</b> → think “<b>com</b>e eat!”</div>"}, {"p": "<span class=\"pr\">tú</span> <span class=\"plus\">+</span> beber", "hint": "beber = to drink", "show": "tú beb[es]", "say": "tú bebes", "a": ["bebes"], "why": "-er verbs: tú → <b>-es</b>.", "ex": "<h3>beber = <span class=\"m\">to drink</span></h3><p>Regular <b>-er</b> verb: stem <b>beb-</b> + o, es, e, emos, en.</p><div class=\"extable\"><div>yo</div><div>beb<span style=\"color:#5ED6BC;font-weight:800\">o</span></div><div class=hi>tú</div><div class=hi>beb<span style=\"color:#5ED6BC;font-weight:800\">es</span></div><div>él / ella / usted</div><div>beb<span style=\"color:#5ED6BC;font-weight:800\">e</span></div><div>nosotros</div><div>beb<span style=\"color:#5ED6BC;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>beb<span style=\"color:#5ED6BC;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Bebo mucha agua.</b> = I drink a lot of water.</p><div class=\"trick\"><b>Memory trick:</b> beber → <b>bev</b>erage (something you drink).</div>"}, {"p": "<span class=\"pr\">usted</span> <span class=\"plus\">+</span> leer", "hint": "leer = to read", "show": "usted le[e]", "say": "usted lee", "a": ["lee"], "why": "usted uses the él form: le + <b>e</b> = lee (yes, two e's!).", "ex": "<h3>leer = <span class=\"m\">to read</span></h3><p>Regular <b>-er</b> verb: stem <b>le-</b> + o, es, e, emos, en (lee has two e's!).</p><div class=\"extable\"><div>yo</div><div>le<span style=\"color:#5ED6BC;font-weight:800\">o</span></div><div>tú</div><div>le<span style=\"color:#5ED6BC;font-weight:800\">es</span></div><div class=hi>él / ella / usted</div><div class=hi>le<span style=\"color:#5ED6BC;font-weight:800\">e</span></div><div>nosotros</div><div>le<span style=\"color:#5ED6BC;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>le<span style=\"color:#5ED6BC;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Me gusta leer en la cama.</b> = I like reading in bed.</p><div class=\"trick\"><b>Memory trick:</b> leer → <b>le</b>ctura / <b>le</b>cture: someone reads to you.</div>"}, {"p": "<span class=\"pr\">nosotros</span> <span class=\"plus\">+</span> vivir", "hint": "vivir = to live", "show": "nosotros viv[imos]", "say": "nosotros vivimos", "a": ["vivimos"], "why": "-ir verbs: nosotros → <b>-imos</b>. This is the only form that's different from -er.", "ex": "<h3>vivir = <span class=\"m\">to live</span></h3><p>Regular <b>-ir</b> verb: stem <b>viv-</b> + o, es, e, imos, en.</p><div class=\"extable\"><div>yo</div><div>viv<span style=\"color:#8DB2FF;font-weight:800\">o</span></div><div>tú</div><div>viv<span style=\"color:#8DB2FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>viv<span style=\"color:#8DB2FF;font-weight:800\">e</span></div><div class=hi>nosotros</div><div class=hi>viv<span style=\"color:#8DB2FF;font-weight:800\">imos</span></div><div>ellos / ustedes</div><div>viv<span style=\"color:#8DB2FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Vivo en Costa Rica.</b> = I live in Costa Rica.</p><div class=\"trick\"><b>Memory trick:</b> vivir → <b>viv</b>id, sur<b>viv</b>e: being alive.</div>"}, {"p": "<span class=\"pr\">ellos</span> <span class=\"plus\">+</span> escribir", "hint": "escribir = to write", "show": "ellos escrib[en]", "say": "ellos escriben", "a": ["escriben"], "why": "ellos → <b>-en</b> for both -er and -ir verbs.", "ex": "<h3>escribir = <span class=\"m\">to write</span></h3><p>Regular <b>-ir</b> verb: stem <b>escrib-</b> + o, es, e, imos, en.</p><div class=\"extable\"><div>yo</div><div>escrib<span style=\"color:#8DB2FF;font-weight:800\">o</span></div><div>tú</div><div>escrib<span style=\"color:#8DB2FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>escrib<span style=\"color:#8DB2FF;font-weight:800\">e</span></div><div>nosotros</div><div>escrib<span style=\"color:#8DB2FF;font-weight:800\">imos</span></div><div class=hi>ellos / ustedes</div><div class=hi>escrib<span style=\"color:#8DB2FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Escribo un mensaje.</b> = I write a message.</p><div class=\"trick\"><b>Memory trick:</b> escribir → <b>scrib</b>ble, de<b>scrib</b>e.</div>"}, {"p": "<span class=\"pr\">nosotros</span> <span class=\"plus\">+</span> comer", "hint": "comer = to eat", "show": "nosotros com[emos]", "say": "nosotros comemos", "a": ["comemos"], "why": "-er verbs: nosotros → <b>-emos</b> (compare: vivimos).", "ex": "<h3>comer = <span class=\"m\">to eat</span></h3><p>Regular <b>-er</b> verb: stem <b>com-</b> + o, es, e, emos, en.</p><div class=\"extable\"><div>yo</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">o</span></div><div>tú</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">es</span></div><div>él / ella / usted</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">e</span></div><div class=hi>nosotros</div><div class=hi>com<span style=\"color:#5ED6BC;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>com<span style=\"color:#5ED6BC;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Comes carne?</b> = Do you eat meat?</p><div class=\"trick\"><b>Memory trick:</b> <b>comer</b> → think “<b>com</b>e eat!”</div>"}]}, {"title": "The -OY verbs + dar", "color": "#FF5C9A", "howto": "New verb! Read the dar table first, then answer.", "lesson": "<p><b>dar = to give.</b> Like estoy, voy and soy, the yo form ends in <b>-oy</b>: <b>doy</b>. The rest is like a regular -ar verb with the tiny stem <b>d-</b>.</p><div class=\"table\" style=\"--c:#FF5C9A\"><div>yo</div><div>d<span class='chg'>oy</span></div><div>tú</div><div>das</div><div>él / ella / usted</div><div>da</div><div>nosotros</div><div>damos</div><div>ellos / ustedes</div><div>dan</div></div><p class=\"muted\">Te doy un regalo. = I give you a gift.</p>", "questions": [{"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> estar", "hint": "estar = to be (how / where you are)", "show": "yo est{oy}", "say": "yo estoy", "a": ["estoy"], "why": "yo → <b>estoy</b>: almost regular -ar, but yo adds a -y (like soy, voy, doy).", "ex": "<h3>estar = <span class=\"m\">to be (how / where you are)</span></h3><p>Almost regular -ar, but yo is <b>estoy</b> and the others have an accent. Use <b>estar</b> for feelings and places.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>est<span style=\"color:#FF5C9A;font-weight:800\">o</span><span class=\"chg\">y</span></div><div>tú</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">ás</span></div><div>él / ella / usted</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">á</span></div><div>nosotros</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">án</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Estoy cansada hoy.</b> = I'm tired today.</p><div class=\"trick\"><b>Memory trick:</b> <b>est</b>ar = how you feel and where you are (like a <b>st</b>ate or a <b>st</b>ation).</div>"}, {"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> dar", "hint": "dar = to give", "show": "yo d{oy}", "say": "yo doy", "a": ["doy"], "why": "yo → <b>doy</b>. Same -oy family: estoy, voy, soy, doy.", "ex": "<h3>dar = <span class=\"m\">to give</span></h3><p>Only yo is special: <b>doy</b> (like estoy, voy, soy). The rest is like a regular -ar verb with the tiny stem d-.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>d<span class=\"chg\">oy</span></div><div>tú</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">as</span></div><div>él / ella / usted</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">a</span></div><div>nosotros</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Te doy un regalo.</b> = I give you a gift.</p><div class=\"trick\"><b>Memory trick:</b> dar → <b>d</b>onate, <b>d</b>ata (things that are given).</div>"}, {"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> ir", "hint": "ir = to go", "show": "yo {voy}", "say": "yo voy", "a": ["voy"], "why": "ir is totally irregular: <b>voy</b> comes from a different Latin verb (vadere), like English go → went.", "ex": "<h3>ir = <span class=\"m\">to go</span></h3><p>Totally irregular: the forms come from a different Latin verb (vadere), like English go → went.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi><span class=\"chg\">voy</span></div><div>tú</div><div><span class=\"chg\">vas</span></div><div>él / ella / usted</div><div><span class=\"chg\">va</span></div><div>nosotros</div><div><span class=\"chg\">vamos</span></div><div>ellos / ustedes</div><div><span class=\"chg\">van</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Voy al trabajo en bus.</b> = I go to work by bus.</p><div class=\"trick\"><b>Memory trick:</b> <b>¡Vamos!</b> = Let's go! (you've probably heard it).</div>"}, {"p": "<span class=\"pr\">tú</span> <span class=\"plus\">+</span> ser", "hint": "ser = to be (who / what you are)", "show": "tú {eres}", "say": "tú eres", "a": ["eres"], "why": "ser is fully irregular: soy, <b>eres</b>, es, somos, son. Memorize it!", "ex": "<h3>ser = <span class=\"m\">to be (who / what you are)</span></h3><p>Fully irregular, like English am / is / are. Use <b>ser</b> for identity: your name, job, where you're from.</p><div class=\"extable\"><div>yo</div><div><span class=\"chg\">soy</span></div><div class=hi>tú</div><div class=hi><span class=\"chg\">eres</span></div><div>él / ella / usted</div><div><span class=\"chg\">es</span></div><div>nosotros</div><div><span class=\"chg\">somos</span></div><div>ellos / ustedes</div><div><span class=\"chg\">son</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Soy profesora de inglés.</b> = I'm an English teacher.</p><div class=\"trick\"><b>Memory trick:</b> <b>S</b>er = <b>S</b>tays the same (who you are).</div>"}, {"p": "<span class=\"pr\">nosotros</span> <span class=\"plus\">+</span> ir", "hint": "ir = to go", "show": "nosotros {vamos}", "say": "nosotros vamos", "a": ["vamos"], "why": "ir: voy, vas, va, <b>vamos</b>, van.", "ex": "<h3>ir = <span class=\"m\">to go</span></h3><p>Totally irregular: the forms come from a different Latin verb (vadere), like English go → went.</p><div class=\"extable\"><div>yo</div><div><span class=\"chg\">voy</span></div><div>tú</div><div><span class=\"chg\">vas</span></div><div>él / ella / usted</div><div><span class=\"chg\">va</span></div><div class=hi>nosotros</div><div class=hi><span class=\"chg\">vamos</span></div><div>ellos / ustedes</div><div><span class=\"chg\">van</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Voy al trabajo en bus.</b> = I go to work by bus.</p><div class=\"trick\"><b>Memory trick:</b> <b>¡Vamos!</b> = Let's go! (you've probably heard it).</div>"}, {"p": "<span class=\"pr\">tú</span> <span class=\"plus\">+</span> dar", "hint": "dar = to give", "show": "tú d[as]", "say": "tú das", "a": ["das"], "why": "Only yo is special (doy). tú → <b>das</b>, just like a regular -ar verb.", "ex": "<h3>dar = <span class=\"m\">to give</span></h3><p>Only yo is special: <b>doy</b> (like estoy, voy, soy). The rest is like a regular -ar verb with the tiny stem d-.</p><div class=\"extable\"><div>yo</div><div>d<span class=\"chg\">oy</span></div><div class=hi>tú</div><div class=hi>d<span style=\"color:#FF5C9A;font-weight:800\">as</span></div><div>él / ella / usted</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">a</span></div><div>nosotros</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Te doy un regalo.</b> = I give you a gift.</p><div class=\"trick\"><b>Memory trick:</b> dar → <b>d</b>onate, <b>d</b>ata (things that are given).</div>"}, {"p": "<span class=\"pr\">ellos</span> <span class=\"plus\">+</span> estar", "hint": "estar = to be (how / where you are)", "show": "ellos est[án]", "say": "ellos están", "a": ["están"], "why": "estar carries an accent: estás, está, <b>están</b>.", "ex": "<h3>estar = <span class=\"m\">to be (how / where you are)</span></h3><p>Almost regular -ar, but yo is <b>estoy</b> and the others have an accent. Use <b>estar</b> for feelings and places.</p><div class=\"extable\"><div>yo</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">o</span><span class=\"chg\">y</span></div><div>tú</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">ás</span></div><div>él / ella / usted</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">á</span></div><div>nosotros</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">amos</span></div><div class=hi>ellos / ustedes</div><div class=hi>est<span style=\"color:#FF5C9A;font-weight:800\">án</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Estoy cansada hoy.</b> = I'm tired today.</p><div class=\"trick\"><b>Memory trick:</b> <b>est</b>ar = how you feel and where you are (like a <b>st</b>ate or a <b>st</b>ation).</div>"}, {"p": "<span class=\"pr\">nosotros</span> <span class=\"plus\">+</span> dar", "hint": "dar = to give", "show": "nosotros d[amos]", "say": "nosotros damos", "a": ["damos"], "why": "nosotros → <b>damos</b> (-amos, like any -ar verb).", "ex": "<h3>dar = <span class=\"m\">to give</span></h3><p>Only yo is special: <b>doy</b> (like estoy, voy, soy). The rest is like a regular -ar verb with the tiny stem d-.</p><div class=\"extable\"><div>yo</div><div>d<span class=\"chg\">oy</span></div><div>tú</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">as</span></div><div>él / ella / usted</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">a</span></div><div class=hi>nosotros</div><div class=hi>d<span style=\"color:#FF5C9A;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Te doy un regalo.</b> = I give you a gift.</p><div class=\"trick\"><b>Memory trick:</b> dar → <b>d</b>onate, <b>d</b>ata (things that are given).</div>"}]}, {"title": "Yo-go verbs", "color": "#D2A8FF", "howto": "Remember: the G is only in the yo form!", "questions": [{"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> tener", "hint": "tener = to have", "show": "yo ten{g}[o]", "say": "yo tengo", "a": ["tengo"], "why": "Yo-go verb: yo adds a <b>g</b> → tengo.", "ex": "<h3>tener = <span class=\"m\">to have</span></h3><p>Yo-go verb (<b>tengo</b>) + e → ie in tú, él, ellos. Nosotros stays regular.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>ten<span class=\"chg\">g</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div>tú</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div>nosotros</div><div>ten<span style=\"color:#D2A8FF;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Tengo dos hermanos.</b> = I have two brothers.</p><div class=\"trick\"><b>Memory trick:</b> tener → <b>ten</b>ant: a person who <b>has</b> a place to live.</div>"}, {"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> hacer", "hint": "hacer = to do / to make", "show": "yo ha{g}[o]", "say": "yo hago", "a": ["hago"], "why": "Yo-go: <b>hago</b>. The rest is regular: haces, hace...", "ex": "<h3>hacer = <span class=\"m\">to do / to make</span></h3><p>Only yo is irregular: <b>hago</b>. Spanish uses ONE verb for both do and make.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>ha<span class=\"chg\">g</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div>tú</div><div>hac<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>hac<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div>nosotros</div><div>hac<span style=\"color:#D2A8FF;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>hac<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Qué haces hoy?</b> = What are you doing today?</p><div class=\"trick\"><b>Memory trick:</b> hacer = do AND make. ¿Qué haces? = What are you doing?</div>"}, {"p": "<span class=\"pr\">tú</span> <span class=\"plus\">+</span> venir", "hint": "venir = to come", "show": "tú v{ie}n[es]", "say": "tú vienes", "a": ["vienes"], "why": "No g for tú! But e → <b>ie</b>: vienes (twin of tener: tienes).", "ex": "<h3>venir = <span class=\"m\">to come</span></h3><p>Twin of tener: yo-go (<b>vengo</b>) + e → ie.</p><div class=\"extable\"><div>yo</div><div>ven<span class=\"chg\">g</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div class=hi>tú</div><div class=hi>v<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>v<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div>nosotros</div><div>ven<span style=\"color:#D2A8FF;font-weight:800\">imos</span></div><div>ellos / ustedes</div><div>v<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Vienes a la fiesta?</b> = Are you coming to the party?</p><div class=\"trick\"><b>Memory trick:</b> venir → e<b>ven</b>t, con<b>ven</b>tion: places people <b>come</b> to.</div>"}, {"p": "<span class=\"pr\">ella</span> <span class=\"plus\">+</span> decir", "hint": "decir = to say / to tell", "show": "ella d{i}c[e]", "say": "ella dice", "a": ["dice"], "why": "e → <b>i</b>: dice. The g is only in yo (digo).", "ex": "<h3>decir = <span class=\"m\">to say / to tell</span></h3><p>Yo-go (<b>digo</b>) + e → i in tú, él, ellos. Nosotros stays regular: decimos.</p><div class=\"extable\"><div>yo</div><div>d<span class=\"chg\">ig</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div>tú</div><div>d<span class=\"chg\">i</span>c<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div class=hi>él / ella / usted</div><div class=hi>d<span class=\"chg\">i</span>c<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div>nosotros</div><div>dec<span style=\"color:#D2A8FF;font-weight:800\">imos</span></div><div>ellos / ustedes</div><div>d<span class=\"chg\">i</span>c<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Cómo se dice “bill” en español?</b> = How do you say “bill” in Spanish?</p><div class=\"trick\"><b>Memory trick:</b> decir → <b>dic</b>tate, pre<b>dic</b>t (saying things).</div>"}, {"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> salir", "hint": "salir = to go out / to leave", "show": "yo sal{g}[o]", "say": "yo salgo", "a": ["salgo"], "why": "Yo-go: <b>salgo</b>. Everything else is regular -ir.", "ex": "<h3>salir = <span class=\"m\">to go out / to leave</span></h3><p>Only yo is irregular: <b>salgo</b>. The rest is regular -ir.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>sal<span class=\"chg\">g</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div>tú</div><div>sal<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>sal<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div>nosotros</div><div>sal<span style=\"color:#D2A8FF;font-weight:800\">imos</span></div><div>ellos / ustedes</div><div>sal<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Salgo del trabajo a las cinco.</b> = I leave work at five.</p><div class=\"trick\"><b>Memory trick:</b> <b>Sal</b>ida = exit sign. salir = to go out.</div>"}, {"p": "<span class=\"pr\">nosotros</span> <span class=\"plus\">+</span> tener", "hint": "tener = to have", "show": "nosotros ten[emos]", "say": "nosotros tenemos", "a": ["tenemos"], "why": "Nosotros stays regular: <b>tenemos</b>. No g, no ie.", "ex": "<h3>tener = <span class=\"m\">to have</span></h3><p>Yo-go verb (<b>tengo</b>) + e → ie in tú, él, ellos. Nosotros stays regular.</p><div class=\"extable\"><div>yo</div><div>ten<span class=\"chg\">g</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div>tú</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div class=hi>nosotros</div><div class=hi>ten<span style=\"color:#D2A8FF;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Tengo dos hermanos.</b> = I have two brothers.</p><div class=\"trick\"><b>Memory trick:</b> tener → <b>ten</b>ant: a person who <b>has</b> a place to live.</div>"}, {"p": "<span class=\"pr\">yo</span> <span class=\"plus\">+</span> decir", "hint": "decir = to say / to tel  → ue (DUER-mo). Nosotros: no change (dor-MI-mos).</p><div class=\"extable\"><div>yo</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">o</span></div><div>tú</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">es</span></div><div class=hi>él / ella / usted</div><div class=hi>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">e</span></div><div>nosotros</div><div>dorm<span style=\"color:#FF5C9A;font-weight:800\">imos</span></div><div>ellos / ustedes</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Duermo ocho horas.</b> = I sleep eight hours.</p><div class=\"trick\"><b>Memory trick:</b> dormir → <b>dorm</b>itory: where students <b>sleep</b>.</div>"}, {"p": "<span class=\"pr\">tú</span> <span class=\"plus\">+</span> poder", "hint": "poder = can / to be able to", "show": "tú p{ue}d[es]", "say": "tú puedes", "a": ["puedes"], "why": "o → <b>ue</b>: PUE-des. ¿Puedes repetir? = Can you repeat?", "ex": "<h3>poder = <span class=\"m\">can / to be able to</span></h3><p>Boot verb o → ue (PUE-do). Nosotros: no change (po-DE-mos). Add a verb right after: Puedo hablar.</p><div class=\"extable\"><div>yo</div><div>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">o</span></div><div class=hi>tú</div><div class=hi>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">es</span></div><div>él / ella / usted</div><div>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">e</span></div><div>nosotros</div><div>pod<span style=\"color:#FF5C9A;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Puedes repetir, por favor?</b> = Can you repeat, please?</p><div class=\"trick\"><b>Memory trick:</b> poder → <b>po</b>wer: if you have power, you <b>can</b>.</div>"}, {"p": "<span class=\"pr\">ellos</span> <span class=\"plus\">+</span> querer", "hint": "querer = to want / to love", "show": "ellos qu{ie}r[en]", "say": "ellos quieren", "a": ["quieren"], "why": "ellos is inside the boot: e → <b>ie</b>, quieren.", "ex": "<h3>querer = <span class=\"m\">to want / to love</span></h3><p>Boot verb e → ie when stressed (QUIE-ro). Nosotros: no change (que-RE-mos).</p><div class=\"extable\"><div>yo</div><div>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">o</span></div><div>tú</div><div>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">es</span></div><div>él / ella / usted</div><div>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">e</span></div><div>nosotros</div><div>quer<span style=\"color:#FF5C9A;font-weight:800\">emos</span></div><div class=hi>ellos / ustedes</div><div class=hi>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Quiero un café, por favor.</b> = I'd like a coffee, please.</p><div class=\"trick\"><b>Memory trick:</b> <b>Te quiero</b> = I love you. So querer = to want / love.</div>"}, {"p": "<span class=\"pr\">nosotros</span> <span class=\"plus\">+</span> dormir", "hint": "dormir = to sleep", "show": "nosotros dorm[imos]", "say": "nosotros dormimos", "a": ["dormimos"], "why": "Nosotros = no change: <b>dormimos</b>.", "ex": "<h3>dormir = <span class=\"m\">to sleep</span></h3><p>Boot verb o → ue (DUER-mo). Nosotros: no change (dor-MI-mos).</p><div class=\"extable\"><div>yo</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">o</span></div><div>tú</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">es</span></div><div>él / ella / usted</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">e</span></div><div class=hi>nosotros</div><div class=hi>dorm<span style=\"color:#FF5C9A;font-weight:800\">imos</span></div><div>ellos / ustedes</div><div>d<span class=\"chg\">ue</span>rm<span style=\"color:#FF5C9A;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Duermo ocho horas.</b> = I sleep eight hours.</p><div class=\"trick\"><b>Memory trick:</b> dormir → <b>dorm</b>itory: where students <b>sleep</b>.</div>"}]}, {"title": "Say it in Spanish", "color": "#5ED6BC", "howto": "Full sentences from the video. You can do it!", "questions": [{"p": "<span class=\"sent\">“I speak English.”</span>", "hint": "Say it in Spanish", "show": "Habl[o] inglés.", "a": ["hablo ingles"], "why": "hablar → yo <b>hablo</b>. No need for yo: the -o already says it's you!", "say": null, "ex": "<h3>hablar = <span class=\"m\">to speak / to talk</span></h3><p>Regular <b>-ar</b> verb: stem <b>habl-</b> + o, as, a, amos, an.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>habl<span style=\"color:#FF9F6B;font-weight:800\">o</span></div><div>tú</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">as</span></div><div>él / ella / usted</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">a</span></div><div>nosotros</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>habl<span style=\"color:#FF9F6B;font-weight:800\">an</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Hablo inglés.</b> = I speak English.</p>"}, {"p": "<span class=\"sent\">“I have two brothers.”</span>", "hint": "Say it in Spanish", "show": "Ten{g}[o] dos hermanos.", "a": ["tengo dos hermanos"], "why": "tener is yo-go: <b>tengo</b>.", "say": null, "ex": "<h3>tener = <span class=\"m\">to have</span></h3><p>Yo-go verb (<b>tengo</b>) + e → ie in tú, él, ellos. Nosotros stays regular.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>ten<span class=\"chg\">g</span><span style=\"color:#D2A8FF;font-weight:800\">o</span></div><div>tú</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">es</span></div><div>él / ella / usted</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">e</span></div><div>nosotros</div><div>ten<span style=\"color:#D2A8FF;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>t<span class=\"chg\">ie</span>n<span style=\"color:#D2A8FF;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Tengo dos hermanos.</b> = I have two brothers.</p><div class=\"trick\"><b>Memory trick:</b> tener → <b>ten</b>ant: a person who <b>has</b> a place to live.</div>"}, {"p": "<span class=\"sent\">“I'm tired today.”</span>", "hint": "Say it in Spanish", "show": "Est{oy} cansada hoy.", "a": ["estoy cansada", "estoy cansado"], "why": "estar → <b>estoy</b> (how you feel = estar). cansada for a girl, cansado for a boy.", "say": null, "ex": "<h3>estar = <span class=\"m\">to be (how / where you are)</span></h3><p>Almost regular -ar, but yo is <b>estoy</b> and the others have an accent. Use <b>estar</b> for feelings and places.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>est<span style=\"color:#FF5C9A;font-weight:800\">o</span><span class=\"chg\">y</span></div><div>tú</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">ás</span></div><div>él / ella / usted</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">á</span></div><div>nosotros</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">amos</span></div><div>ellos / ustedes</div><div>est<span style=\"color:#FF5C9A;font-weight:800\">án</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Estoy cansada hoy.</b> = I'm tired today.</p><div class=\"trick\"><b>Memory trick:</b> <b>est</b>ar = how you feel and where you are (like a <b>st</b>ate or a <b>st</b>ation).</div>"}, {"p": "<span class=\"sent\">“I go to work by bus.”</span>", "hint": "Say it in Spanish", "show": "{Voy} al trabajo en bus.", "a": ["voy al trabajo"], "why": "ir → <b>voy</b>. a + el = al.", "say": null, "ex": "<h3>ir = <span class=\"m\">to go</span></h3><p>Totally irregular: the forms come from a different Latin verb (vadere), like English go → went.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi><span class=\"chg\">voy</span></div><div>tú</div><div><span class=\"chg\">vas</span></div><div>él / ella / usted</div><div><span class=\"chg\">va</span></div><div>nosotros</div><div><span class=\"chg\">vamos</span></div><div>ellos / ustedes</div><div><span class=\"chg\">van</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Voy al trabajo en bus.</b> = I go to work by bus.</p><div class=\"trick\"><b>Memory trick:</b> <b>¡Vamos!</b> = Let's go! (you've probably heard it).</div>"}, {"p": "<span class=\"sent\">“I'd like a coffee, please.”</span>", "hint": "Say it in Spanish", "show": "Qu{ie}r[o] un café, por favor.", "a": ["quiero un cafe"], "why": "querer → <b>quiero</b> (boot verb e → ie).", "say": null, "ex": "<h3>querer = <span class=\"m\">to want / to love</span></h3><p>Boot verb e → ie when stressed (QUIE-ro). Nosotros: no change (que-RE-mos).</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">o</span></div><div>tú</div><div>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">es</span></div><div>él / ella / usted</div><div>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">e</span></div><div>nosotros</div><div>quer<span style=\"color:#FF5C9A;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>qu<span class=\"chg\">ie</span>r<span style=\"color:#FF5C9A;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">Quiero un café, por favor.</b> = I'd like a coffee, please.</p><div class=\"trick\"><b>Memory trick:</b> <b>Te quiero</b> = I love you. So querer = to want / love.</div>"}, {"p": "<span class=\"sent\">“Can you repeat, please?”</span>", "hint": "Say it in Spanish", "show": "¿P{ue}d[es] repetir, por favor?", "a": ["puedes repetir"], "why": "poder → tú <b>puedes</b> + a verb right after: repetir.", "say": null, "ex": "<h3>poder = <span class=\"m\">can / to be able to</span></h3><p>Boot verb o → ue (PUE-do). Nosotros: no change (po-DE-mos). Add a verb right after: Puedo hablar.</p><div class=\"extable\"><div>yo</div><div>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">o</span></div><div class=hi>tú</div><div class=hi>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">es</span></div><div>él / ella / usted</div><div>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">e</span></div><div>nosotros</div><div>pod<span style=\"color:#FF5C9A;font-weight:800\">emos</span></div><div>ellos / ustedes</div><div>p<span class=\"chg\">ue</span>d<span style=\"color:#FF5C9A;font-weight:800\">en</span></div></div><p class=\"muted\">Example: <b style=\"color:var(--ink)\">¿Puedes repetir, por favor?</b> = Can you repeat, please?</p><div class=\"trick\"><b>Memory trick:</b> poder → <b>po</b>wer: if you have power, you <b>can</b>.</div>"}, {"p": "<span class=\"sent\">“I give you a gift.”</span>", "hint": "Say it in Spanish", "show": "Te d{oy} un regalo.", "a": ["te doy un regalo", "doy un regalo"], "why": "dar → <b>doy</b>. te = to you.", "say": null, "ex": "<h3>dar = <span class=\"m\">to give</span></h3><p>Only yo is special: <b>doy</b> (like estoy, voy, soy). The rest is like a regular -ar verb with the tiny stem d-.</p><div class=\"extable\"><div class=hi>yo</div><div class=hi>d<span class=\"chg\">oy</span></div><div>tú</div><div>d<span style=\"color:#FF5C9A;font-weight:800\">as</span></div><div>él / ella / usted< const FLAV = ["#7B4A33","#8A5439","#6E4130","#94603F","#764632","#86503A","#6A3E2D","#90593C"];
const FLAVD = ["#4A2A1C","#542F1F","#43271B","#5A3522","#482A1D","#52301F","#40251A","#583321"];
const app = document.getElementById('app');
const NAME = "Glhea";
let secIdx = -1, qIdx = 0, scoops = 0, firstTry = 0, totalQ = 0, missed = [], queue = [], answered = false;
DATA.sections.forEach(s => totalQ += s.questions.length);
let doneQ = 0;
const PKEY='glhea_progress_'+(location.pathname.split('/').pop()||'index').replace('.html','');
function saveP(phase){const o={v:1,phase,secIdx,qIdx,scoops,firstTry,doneQ,missed,queue,retry:DATA.sections.map(s=>!!s._retry),attempt:TRACK.getAttempt(),total:DATA.sections.length,ts:Date.now()};try{localStorage.setItem(PKEY,JSON.stringify(o));}catch(e){}TRACK.saveProgress(o);}
function okP(p){return p&&p.v===1&&p.total===DATA.sections.length&&p.secIdx>=0&&p.secIdx<DATA.sections.length?p:null;}
function loadP(){try{return okP(JSON.parse(localStorage.getItem(PKEY)||'null'));}catch(e){return null;}}
function clearP(){try{localStorage.removeItem(PKEY);}catch(e){}TRACK.clearProgress();}
function resumeP(p){secIdx=p.secIdx;qIdx=p.qIdx;scoops=p.scoops;firstTry=p.firstTry;doneQ=p.doneQ;missed=p.missed||[];queue=p.queue||[];DATA.sections.forEach((s,i)=>s._retry=!!(p.retry&&p.retry[i]));TRACK.setAttempt(p.attempt);segs();bar();
  if(p.phase==='between'){nextSection();}
  else if(p.phase==='retry'){const s=DATA.sections[secIdx];s._retry=true;queue=missed.slice();missed=[];qIdx=0;if(queue.length)showQ();else nextSection();}
  else if(queue.length&&qIdx<queue.length){showQ();}
  else{nextSection();}}

// ---------- helpers ----------
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:"“”'’]/g," ").replace(/\s+/g," ").trim();}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
// markup: habl[o] -> ending, {g} -> change
function mk(s){return esc(s).replace(/\[([^\]]*)\]/g,'<span class="end" style="color:var(--c)">$1</span>').replace(/\{([^}]*)\}/g,'<span class="chg">$1</span>');}
function plain(s){return s.replace(/[\[\]{}]/g,"");}
function segs(){const el=document.getElementById('segs');el.innerHTML='';DATA.sections.forEach((s,i)=>{const d=document.createElement('div');d.className='seg'+(i<scoops?' on':'');if(i<scoops)d.style.background=FLAV[i%8];el.appendChild(d);});}
function bar(){document.getElementById('bar').style.width=(100*doneQ/totalQ)+'%';}
function confetti(n=90){const c=document.getElementById('conf');const cols=['#FF5C9A','#FF8FBC','#FFC2DA','#B8326A','#FFFFFF','#8A5439'];for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=cols[i%6];e.style.animationDuration=(2+Math.random()*2.5)+'s';e.style.animationDelay=(Math.random()*0.8)+'s';c.appendChild(e);setTimeout(()=>e.remove(),5200);}}
const ICON_MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>';
const ICON_SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

// ---------- speech out ----------
let esVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices();esVoice=v.find(x=>/es[-_](MX|US|419|CR)/i.test(x.lang)&&/google/i.test(x.name))||v.find(x=>/^es/i.test(x.lang)&&/google/i.test(x.name))||v.find(x=>/^es/i.test(x.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=esVoice?esVoice.lang:'es-MX';if(esVoice)u.voice=esVoice;u.rate=0.85;speechSynthesis.speak(u);}

// ---------- speech in ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recOn=false;
function listen(onText, statusEl, micEl){
  if(!SR){statusEl.textContent="Voice isn't supported in this browser. Open this page in Chrome, or type your answer.";return;}
  if(recOn){try{rec.stop();}catch(e){}return;}
  rec=new SR(); rec.lang='es-MX'; rec.interimResults=true; rec.maxAlternatives=5; rec.continuous=false;
  let finalAlts=null;
  rec.onstart=()=>{recOn=true;micEl.classList.add('rec');statusEl.textContent='Listening... say your answer in Spanish';try{statusEl.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}};
  rec.onresult=(ev)=>{const r=ev.results[ev.results.length-1];const t=r[0].transcript;statusEl.textContent='I heard: "'+t+'"';if(r.isFinal){try{statusEl.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}finalAlts=[];for(let i=0;i<r.length;i++)finalAlts.push(r[i].transcript);}};
  rec.onerror=(ev)=>{const m={'not-allowed':"The microphone is blocked. Allow the microphone for this page (lock icon next to the address), or open this file directly in Chrome. You can also type your answer.",'service-not-allowed':"The microphone is blocked here. Download this page and open it in Chrome, or type your answer.",'no-speech':"I didn't hear anything. Tap the mic and try again!",'audio-capture':"No microphone found. You can type your answer instead.",'network':"Voice needs an internet connection. You can type your answer instead."};statusEl.textContent=m[ev.error]||('Voice error: '+ev.error+'. You can type your answer.');};
  rec.onend=()=>{recOn=false;micEl.classList.remove('rec');if(finalAlts&&finalAlts.length)onText(finalAlts);};
  try{rec.start();}catch(e){statusEl.textContent='Could not start the microphone. Type your answer instead.';}
}

// ---------- screens ----------
function stickerScreen(key, title, text, btn, next){
  app.innerHTML=`<div class="card sticker"><img src="${IMG[key]}" alt=""><h2 style="margin-top:18px">${title}</h2><p class="muted">${text}</p><button class="btn pink" id="go">${btn}</button></div>`;
  document.getElementById('go').onclick=next; window.scrollTo(0,0);
}
function start(){
  segs(); bar();
  app.innerHTML=`<div class="card"><span class="pill" style="background:var(--pink)">${DATA.tag}</span><h1>¡Hola, ${NAME}!</h1><p>${DATA.intro}</p>${(()=>{const p=loadP();return p?`<div class="resume" id="resume"><p><b>Welcome back, ${NAME}!</b> Your progress was saved: you were on <b>Section ${p.secIdx+(p.phase==='between'?2:1)}</b> of ${DATA.sections.length}.</p><div class="row"><button class="btn pink" id="rgo">Continue</button><button class="btn alt" id="rno">Start over</button></div></div>`:'';})()}
  <div class="progress-list">${DATA.sections.map((s,i)=>`<div><span>${i+1}. ${s.title}</span><span class="muted">${s.questions.length} questions</span></div>`).join('')}</div>
  <p><b>How it works:</b> tap the pink <b>microphone</b> and <b>say</b> your answer in Spanish, or type it in the box. Finish a section with everything right and you earn a <b>scoop of ice cream</b>. Fill the meter to win!</p>
  ${!SR?'<div class="warn">Voice answers need Chrome (computer or Android) or Safari. In this browser you can still type your answers.</div>':(window.self!==window.top?'<div class="warn">Voice answers may not work inside this preview window. Download this file and open it in Chrome to answer by speaking. Typing works everywhere!</div>':'')}
  <div class="row" style="margin-top:14px"><button class="btn pink" id="go">Let's go!</button><button class="btn alt" id="test">Test my microphone</button></div><div class="status" id="st"></div></div>`;
  document.getElementById('go').onclick=()=>stickerScreen('youcan','You can do this!',`Take your time, ${NAME}. Mistakes are how you learn.`,'Start section 1',()=>{TRACK.begin();nextSection();});
  const st=document.getElementById('st'), tb=document.getElementById('test');
  const rs=document.getElementById('resume');if(rs){document.getElementById('rgo').onclick=()=>resumeP(loadP());document.getElementById('rno').onclick=()=>{clearP();rs.remove();};}
  tb.onclick=()=>listen(alts=>{st.textContent='Your microphone works! I heard: "'+alts[0]+'"';},st,tb);
}
function nextSection(){
  secIdx++; if(secIdx>=DATA.sections.length) return finish();
  const s=DATA.sections[secIdx]; queue=s.questions.map((q,i)=>i); missed=[]; qIdx=0;
  app.innerHTML=`<div class="card" style="--c:${s.color}"><span class="pill" style="background:${s.color}">Section ${secIdx+1} of ${DATA.sections.length}</span><h2>${s.title}</h2>${s.lesson||''}<p class="muted">${s.howto||''}</p><button class="btn" id="go">Start</button></div>`;
  document.getElementById('go').onclick=()=>showQ(); window.scrollTo(0,0);
}
function showQ(){
  const s=DATA.sections[secIdx]; const i=queue[qIdx]; const q=s.questions[i]; answered=false; saveP('q');
  const retry = s._retry ? ' · retry' : '';
  let body = `<div class="card" style="--c:${s.color}"><div class="qmeta"><span>${s.title}${retry}</span><span>${qIdx+1} / ${queue.length}</span></div>
  <div class="prompt">${q.p}</div>${q.hint?`<div class="hint">${q.hint}</div>`:''}`;
  if(q.options){
    body += `<div class="choices">${q.options.map((o,k)=>`<button class="choice" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    body += `<div class="answerzone"><button class="mic" id="mic" aria-label="Say your answer">${ICON_MIC}</button>
    <form class="typebox" id="tf"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="...or type it here" aria-label="Type your answer"><button class="btn" type="submit">Check</button></form></div>`;
  }
  body += `<div class="status" id="st"></div><div id="fb"></div></div>`;
  app.innerHTML=body; window.scrollTo(0,0);
  if(q.options){
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(answered) return; const k=+b.dataset.k; app.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right');}); if(k!==q.a)b.classList.add('wrong'); window.__given=q.options[k];window.__voice=false;grade(k===q.a,q,null);});
  } else {
    const st=document.getElementById('st'), mic=document.getElementById('mic'), inp=document.getElementById('inp');
    mic.onclick=()=>listen(alts=>{ if(answered) return; inp.value=alts[0]; check(alts,true); },st,mic);
    document.getElementById('tf').onsubmit=(e)=>{e.preventDefault(); if(answered) return; if(!inp.value.trim()){st.textContent='Type or say an answer first.';return;} check([inp.value],false);};
  }
}
function matches(alt, acc){
  const a=' '+norm(alt)+' ';
  return acc.some(x=>{const n=norm(x); return a===' '+n+' ' || a.includes(' '+n+' ');});
}
function check(alts, spoken){
  const q=DATA.sections[secIdx].questions[queue[qIdx]];
  const ok = alts.some(a=>matches(a,q.a));
  let note='';
  if(ok && !spoken){ const typed=alts[0].trim().toLowerCase(); const exact=q.a.some(x=>typed.includes(x.toLowerCase())); if(!exact && /[áéíóúñ]/i.test(q.a[0])) note=`Tip: it's written <b>${esc(q.a[0])}</b> (with the accent).`; }
  window.__given=alts[0];window.__voice=!!spoken;grade(ok,q,note);
}
function grade(ok,q,note){
  answered=true; const s=DATA.sections[secIdx];
  TRACK.answer({section:s.title,qnum:queue[qIdx]+1,prompt:q.p,expected:q.options?q.options[q.a]:q.a[0],given:window.__given,ok:ok,retry:!!s._retry,voice:!!window.__voice});
  if(ok){ if(!s._retry) firstTry++; } else missed.push(queue[qIdx]);
  if(!s._retry || ok) { }
  const shown = q.show ? mk(q.show) : esc(q.options ? q.options[q.a] : q.a[0]);
  const spoken = q.say || plain(q.show || (q.options ? q.options[q.a] : q.a[0]));
  const praise = ['¡Muy bien!','¡Excelente!','¡Perfecto!','¡Eso es!','¡Genial!'][Math.floor(Math.random()*5)];
  const pool = ok ? ['ok1','ok2','ok3','ok4','ok5'] : ['bad1','bad2'];
  const stk = pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><div class="fbwrap"><div class="fbmain"><div class="big">${ok?praise:'Not quite, '+NAME+'!'}</div>
   ${ok?'':'<div class="muted">The answer is:</div>'}<div class="ans">${shown}</div>
   ${note?`<div class="small">${note}</div>`:''}</div><img class="fbst" src="${IMG[stk]}" alt=""></div>
   ${q.why?`<div class="why"><b>Why?</b> ${q.why}</div>`:''}
   <div class="row" style="margin-top:12px"><button class="listen" id="ls">${ICON_SPK} Listen</button>${q.ex?`<button class="explain" id="exb" aria-expanded="false" aria-controls="exbox"><img src="${IMG.explain}" alt=""> Explain</button>`:''}<button class="btn" id="nx">Next</button></div>
   <div id="exbox" class="exbox" hidden>${q.ex||''}</div></div>`;
  document.getElementById('ls').onclick=()=>say(spoken);
  const exb=document.getElementById('exb');
  if(exb) exb.onclick=()=>{const bx=document.getElementById('exbox');const open=bx.hidden;bx.hidden=!open;exb.setAttribute('aria-expanded',open);if(open)bx.scrollIntoView({behavior:'smooth',block:'nearest'});};
  document.getElementById('nx').onclick=()=>{ if(!s._retry) {doneQ++; bar();} qIdx++; if(qIdx<queue.length) showQ(); else endSection(); };
  document.getElementById('nx').focus();
}
function endSection(){
  const s=DATA.sections[secIdx];
  if(missed.length===0){
    scoops++; segs(); confetti(70);
    const opts=[['goodjob','Good job, '+NAME+'!'],['thumbs','¡Muy bien, '+NAME+'!'],['suit','Excellent work, '+NAME+'!']];
    const o=opts[secIdx%3];
    s._retry=false; saveP('between');
    stickerScreen(o[0], o[1], `Section complete! You earned scoop number ${scoops} of ${DATA.sections.length}.`, secIdx+1<DATA.sections.length?'Next section':'See my ice cream!', ()=>nextSection());
  } else {
    const n=missed.length; saveP('retry');
    stickerScreen('youcan','You can do this!',`You missed ${n} ${n===1?'question':'questions'}. Let's try ${n===1?'it':'them'} again. Get ${n===1?'it':'them all'} right to earn your scoop!`,'Try again',()=>{s._retry=true; queue=missed.slice(); missed=[]; qIdx=0; showQ();});
  }
}
function finish(){
  segs(); bar(); confetti(160); TRACK.done(firstTry,totalQ); clearP();
  const n=DATA.sections.length; let sc='';
  for(let i=0;i<n;i++){ const y=290-i*52; sc+=`<ellipse cx="100" cy="${y}" rx="58" ry="48" fill="${FLAV[i%8]}" stroke="${FLAVD[i%8]}" stroke-width="4"/>`; }
  const top=290-(n-1)*52-48; const h=420-top+20;
  app.innerHTML=`<div class="card" style="text-align:center"><h1>¡Felicidades, ${NAME}!</h1><p style="font-size:20px">You filled the meter. <b>You won an ice cream!</b> <span class="muted">¡Ganaste un helado!</span></p>
  <svg viewBox="0 ${top-40} 200 ${h+40}" style="width:min(220px,55%);height:auto" role="img" aria-label="Ice cream with ${n} scoops"><polygon points="45,318 155,318 100,440" fill="#DEA65F" stroke="#B4783C" stroke-width="4"/>${sc}<circle cx="100" cy="${top-6}" r="18" fill="#D7283C"/></svg>
  <p style="margin-top:10px">First-try score: <span class="scorebig">${firstTry}/${totalQ}</span></p>
  <div class="sticker"><img src="${IMG.proud}" alt=""></div>
  <h2 style="margin-top:16px">I'm so proud of you!</h2>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pink" id="again">Play again</button></div></div>`;
  document.getElementById('again').onclick=()=>{secIdx=-1;scoops=0;firstTry=0;doneQ=0;DATA.sections.forEach(s=>s._retry=false);start();};
  window.scrollTo(0,0);
}
function resetAll(){secIdx=-1;qIdx=0;scoops=0;firstTry=0;doneQ=0;missed=[];queue=[];DATA.sections.forEach(s=>s._retry=false);segs();bar();}
function toast(){const t=document.createElement('div');t.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:20;background:#24151F;border:2px solid var(--pink);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:15px';t.innerHTML='<span>Continuing where you left off ✓</span><button class="btn alt" style="padding:8px 14px;min-height:0;font-size:14px">Start over</button>';document.body.appendChild(t);t.querySelector('button').onclick=()=>{clearP();resetAll();t.remove();start();};setTimeout(()=>t.remove(),9000);}
app.innerHTML='<div class="card"><p class="muted">Loading your progress…</p></div>';
(async()=>{let r=null;try{r=await Promise.race([TRACK.loadProgress(),new Promise(res=>setTimeout(()=>res(null),2500))]);}catch(e){}
  r=okP(r);const l=loadP();const p=(l&&r)?(r.ts>l.ts?r:l):(l||r);
  if(p){resumeP(p);toast();}else start();})();
</script>
</body>
